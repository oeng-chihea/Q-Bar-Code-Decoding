server:
  port: ${PORT:8080}

spring:
  application:
    name: excel-reconciler
  servlet:
    multipart:
      max-file-size: 100MB
      max-request-size: 100MB
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USERNAME:guest}
    password: ${RABBITMQ_PASSWORD:guest}
    virtual-host: ${RABBITMQ_VIRTUAL_HOST:/}
    ssl:
      enabled: ${RABBITMQ_SSL_ENABLED:false}
  autoconfigure:
    # The MySQL DataSource is created by DatabaseConfig only when MYSQL_URL is set,
    # so the app still starts (and tests still run) without a database.
    exclude:
      - org.springframework.boot.autoconfigure.jdbc.DataSourceAutoConfiguration

gemini:
  api:
    key: ${GEMINI_API_KEY:}
    model: ${GEMINI_API_MODEL:gemini-3.5-flash-lite}
    url: ${GEMINI_API_URL:https://generativelanguage.googleapis.com/v1beta/models}
    timeout-seconds: ${GEMINI_API_TIMEOUT_SECONDS:40}
    date-read-batch-size: ${GEMINI_DATE_READ_BATCH_SIZE:6}
    date-read-timeout-seconds: ${GEMINI_DATE_READ_TIMEOUT_SECONDS:30}
    date-read-budget-seconds: ${GEMINI_DATE_READ_BUDGET_SECONDS:60}
    # How closely Gemini looks at each image; HIGH helps with small digits such as dates. Leave empty to use the model default
    media-resolution: ${GEMINI_MEDIA_RESOLUTION:MEDIA_RESOLUTION_HIGH}


app:
  cors:
    allowed-origins: "${APP_CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000,http://127.0.0.1:5173,http://127.0.0.1:3000}"
  reconciliation:
    storage-root: ${RECONCILIATION_STORAGE_ROOT:runtime/reconciliations}
    # Stored uploads/results of finished jobs older than this are deleted hourly (0 disables cleanup)
    retention-hours: ${RECONCILIATION_RETENTION_HOURS:24}
  waybill:
    # An unmatched waybill becomes overdue once it has been unmatched for more than this many days
    overdue-days: ${WAYBILL_OVERDUE_DAYS:6}
    zone: ${WAYBILL_ZONE:Asia/Phnom_Penh}
  database:
    url: ${MYSQL_URL:}
    username: ${MYSQL_USERNAME:}
    password: ${MYSQL_PASSWORD:}
    max-pool-size: ${MYSQL_MAX_POOL_SIZE:5}
