server:
  port: ${PORT:8080}

spring:
  application:
    name: excel-reconciler
  servlet:
    multipart:
      max-file-size: 100MB
      max-request-size: 100MB
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USERNAME:guest}
    password: ${RABBITMQ_PASSWORD:guest}
    virtual-host: ${RABBITMQ_VIRTUAL_HOST:/}
    ssl:
      enabled: ${RABBITMQ_SSL_ENABLED:false}

gemini:
  api:
    key: ${GEMINI_API_KEY:}
    model: ${GEMINI_API_MODEL:gemini-flash-lite-latest}
    url: ${GEMINI_API_URL:https://generativelanguage.googleapis.com/v1beta/models}
    timeout-seconds: ${GEMINI_API_TIMEOUT_SECONDS:40}


app:
  cors:
    allowed-origins: "${APP_CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000,http://127.0.0.1:5173,http://127.0.0.1:3000}"
  reconciliation:
    storage-root: ${RECONCILIATION_STORAGE_ROOT:runtime/reconciliations}
